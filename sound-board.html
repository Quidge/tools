<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sound Board</title>
  <style>
    :root {
      --page-max-width: 800px;
      --page-padding: 24px;
      --page-padding-mobile: 16px;

      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;

      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.25rem;
      --text-2xl: 1.5rem;

      --line-heading: 1.25;
      --line-ui: 1.4;
      --line-copy: 1.5;
      --control-min-height: 44px;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 12px;
      --transition-fast: 0.15s;

      /* --- Hex fallbacks (pre-oklch browsers) --- */
      --bg: #f8f9fa;
      --surface: #ffffff;
      --hover: #f1f3f4;
      --border: #dadce0;
      --text-muted: #9aa0a6;
      --text-secondary: #5f6368;
      --text-primary: #202124;
      --toast-bg: #323232;

      --accent-light: #e8f0fe;
      --accent: #2d5ed4;
      --accent-hover: #1765cc;

      --error-bg: #fce8e6;
      --error: #bb061e;
      --success-bg: #e6f4ea;
      --success: #00763a;
      --warning-bg: #fef7e0;
      --warning: #996700;
    }

    @supports (color: oklch(0 0 0)) {
      :root {
        --bg: oklch(0.975 0.003 264);
        --surface: oklch(1 0 0);
        --hover: oklch(0.955 0.003 264);
        --border: oklch(0.88 0.005 264);
        --text-muted: oklch(0.69 0.01 264);
        --text-secondary: oklch(0.50 0.01 264);
        --text-primary: oklch(0.23 0.005 264);
        --toast-bg: oklch(0.27 0 0);

        --accent-light: oklch(0.93 0.04 264);
        --accent: oklch(0.52 0.19 264);
        --accent-hover: oklch(0.495 0.18 264);

        --error-bg: oklch(0.94 0.03 25);
        --error: oklch(0.50 0.2 25);
        --success-bg: oklch(0.94 0.04 155);
        --success: oklch(0.49 0.14 155);
        --warning-bg: oklch(0.94 0.05 85);
        --warning: oklch(0.55 0.15 85);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: system-ui, sans-serif;
      font-size: var(--text-base);
      background: var(--bg);
      color: var(--text-primary);
      line-height: var(--line-copy);
      /* Lock to the viewport: the board fills the screen, no scrolling. */
      overflow: hidden;
      overscroll-behavior: none;
    }

    button {
      font: inherit;
    }

    #app {
      max-width: var(--page-max-width);
      margin: 0 auto;
      /* Fill the visible viewport (dvh tracks mobile browser chrome). */
      height: 100dvh;
      padding: calc(var(--page-padding) + env(safe-area-inset-top, 0px))
               calc(var(--page-padding) + env(safe-area-inset-right, 0px))
               calc(var(--page-padding) + env(safe-area-inset-bottom, 0px))
               calc(var(--page-padding) + env(safe-area-inset-left, 0px));
      display: flex;
      flex-direction: column;
    }

    header {
      flex: 0 0 auto;
      margin-bottom: var(--space-4);
    }

    h1 {
      font-size: var(--text-2xl);
      line-height: var(--line-heading);
      margin-bottom: var(--space-1);
    }

    p.description {
      color: var(--text-secondary);
      font-size: var(--text-sm);
      max-width: 60ch;
    }

    /* --- Board: 2-col grid that grows to fill remaining height --- */
    .board {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-auto-rows: 1fr;
      gap: var(--space-3);
    }

    .pad {
      /* Big, mashable touch target. */
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);

      border: 1px solid var(--accent);
      border-radius: var(--radius-lg);
      background: var(--accent-light);
      color: var(--accent-hover);
      cursor: pointer;

      font-weight: 800;
      font-size: clamp(1.5rem, 7vw, 2.75rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;

      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      transition: transform var(--transition-fast) ease,
                  background var(--transition-fast) ease,
                  box-shadow var(--transition-fast) ease;
    }

    .pad .pad-label {
      pointer-events: none;
      transition: opacity var(--transition-fast) ease;
    }

    /* Dim the label until this pad's audio is ready to play through. */
    .pad.loading .pad-label {
      opacity: 0.4;
    }

    /* Per-pad loading spinner, shown top-right until the sound is ready. */
    .pad-spinner {
      position: absolute;
      top: var(--space-3);
      right: var(--space-3);
      width: 16px;
      height: 16px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      opacity: 0.55;
      pointer-events: none;
      animation: pad-spin 0.7s linear infinite;
    }
    /* Once ready (or on load error), the spinner is gone. */
    .pad.ready .pad-spinner,
    .pad.load-error .pad-spinner {
      display: none;
    }

    @keyframes pad-spin {
      to { transform: rotate(360deg); }
    }

    .pad:hover:not(:active) {
      background: oklch(0.91 0.05 264);
    }

    .pad:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    /* Pressed / actively-playing pad gets a filled, punched-in look. */
    .pad:active,
    .pad.playing {
      background: var(--accent);
      color: var(--surface);
      transform: scale(0.97);
      box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.25);
    }

    /* Quick flash on every (re)trigger, even when already playing. */
    @keyframes pad-pulse {
      0%   { transform: scale(0.93); }
      100% { transform: scale(0.97); }
    }
    .pad.trigger {
      animation: pad-pulse 0.12s ease-out;
    }

    @media (prefers-reduced-motion: reduce) {
      .pad { transition: background var(--transition-fast) ease; }
      .pad.trigger { animation: none; }
      .pad:active, .pad.playing { transform: none; }
      /* Keep a static ring instead of spinning; label dim still signals loading. */
      .pad-spinner { animation: none; }
    }

    /* --- Responsive --- */
    @media (max-width: 600px) {
      #app {
        padding: calc(var(--page-padding-mobile) + env(safe-area-inset-top, 0px))
                 calc(var(--page-padding-mobile) + env(safe-area-inset-right, 0px))
                 calc(var(--page-padding-mobile) + env(safe-area-inset-bottom, 0px))
                 calc(var(--page-padding-mobile) + env(safe-area-inset-left, 0px));
      }
      header { margin-bottom: var(--space-3); }
      h1 { font-size: var(--text-xl); }
    }

    /* Short / landscape screens: keep all four pads visible without scrolling. */
    @media (max-height: 480px) {
      header { margin-bottom: var(--space-2); }
      h1 { font-size: var(--text-lg); margin-bottom: 0; }
      p.description { display: none; }
      .board { gap: var(--space-2); }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Sound Board</h1>
      <p class="description">Tap a pad to fire its sound. Tap again to cut it off and replay instantly.</p>
    </header>

    <main class="board" id="board" aria-label="Sound pads">
      <button type="button" class="pad" data-pad="0">
        <span class="pad-label">Fuaaa</span>
      </button>
      <button type="button" class="pad" data-pad="1">
        <span class="pad-label">Boom</span>
      </button>
      <button type="button" class="pad" data-pad="2">
        <span class="pad-label">Wow</span>
      </button>
      <button type="button" class="pad" data-pad="3">
        <span class="pad-label">Bruh</span>
      </button>
      <button type="button" class="pad" data-pad="4">
        <span class="pad-label">Gottem</span>
      </button>
      <button type="button" class="pad" data-pad="5">
        <span class="pad-label">Horn</span>
      </button>
    </main>
  </div>

    const pads = Array.from(document.querySelectorAll('.pad'));

    // Playback uses one HTMLAudioElement per pad instead of the Web Audio API.
    // Why: on iOS, Web Audio output is silenced by the hardware Ring/Silent
    // switch (and Low Power Mode), so the board can be dead-silent on a phone
    // whose mute switch is on while working everywhere else. Media elements
    // play through the normal media channel and are NOT muted by that switch,
    // as long as the first play() runs inside a user gesture (the tap below).
    // Each pad gets its own element so pads can overlap and each retriggers
    // independently.
    // Per-pad source: 01 fuaaa, 02 boom, 03 wow, 04 bruh, 05 gottem, 06 horn.
    const PAD_SRC = [AUDIO_SRC, BOOM_SRC, WOW_SRC, BRUH_SRC, GOTTEM_SRC, HORN_SRC];

    // Each pad shows a loading spinner until its audio has buffered enough to
    // play through without stalling. The clips are inlined data URIs, so on a
    // fast machine this is near-instant, but the indicator keeps the UI honest
    // on a slow page load / throttled CPU and gives clear feedback that a pad
    // isn't armed yet.
    function markReady(pad) {
      pad.classList.remove('loading');
      pad.classList.add('ready');
      pad.removeAttribute('aria-busy');
    }
    function markError(pad) {
      pad.classList.remove('loading');
      pad.classList.add('load-error');
      pad.removeAttribute('aria-busy');
    }

    const players = pads.map((pad, i) => {
      // Start in the loading state and give the pad a spinner.
      pad.classList.add('loading');
      pad.setAttribute('aria-busy', 'true');
      const spinner = document.createElement('span');
      spinner.className = 'pad-spinner';
      spinner.setAttribute('aria-hidden', 'true');
      pad.appendChild(spinner);

      // Create the element first, wire up readiness listeners, THEN set the
      // source so we never miss the canplaythrough event.
      const audio = new Audio();
      audio.preload = 'auto';
      audio.addEventListener('canplaythrough', () => markReady(pad), { once: true });
      audio.addEventListener('error', () => markError(pad));
      audio.src = PAD_SRC[i];
      // Safety net: if the browser already has enough data (e.g. cached decode),
      // canplaythrough may have fired before we attached — clear the state now.
      if (audio.readyState >= 4 /* HAVE_ENOUGH_DATA */) markReady(pad);
      return audio;
    });

    function play(padIndex, padEl) {
      const audio = players[padIndex];
      // Restart from the top. Seeking a playing element cuts it off and
      // replays it — no pause()/play() race that can throw on mobile.
      try { audio.currentTime = 0; } catch (_) { /* not seekable yet */ }
      const result = audio.play();
      if (result && typeof result.catch === 'function') {
        result.catch((err) => console.error('Could not play sound:', err));
      }
      padEl.classList.add('playing');
    }

    pads.forEach((pad, index) => {
      players[index].addEventListener('ended', () => pad.classList.remove('playing'));

      const trigger = (e) => {
        // Play synchronously inside the gesture so iOS unlocks/keeps audio.
        // pointerdown gives the snappiest, lowest-latency retrigger on touch.
        e.preventDefault();
        play(index, pad);

        // Re-arm the pulse animation on every tap, even mid-playback.
        pad.classList.remove('trigger');
        // Force reflow so the animation restarts.
        void pad.offsetWidth;
        pad.classList.add('trigger');
      };

      pad.addEventListener('pointerdown', trigger);
      pad.addEventListener('animationend', () => pad.classList.remove('trigger'));

      // Keyboard accessibility: Enter/Space fire the pad too.
      pad.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          play(index, pad);
        }
      });
      // pointerdown already handled playback; stop the synthetic click.
      pad.addEventListener('click', (e) => e.preventDefault());
    });
